[project]
name = "stock-market-intelligence-with-langchain"
version = "0.1.0"
description = "A local stock market intelligence CLI and agentic engineering learning project"
readme = "README.md"
authors = [
    { name = "Qian Wu", email = "qian.wu.dev@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "langchain>=1.4.3",
    "langchain-deepseek>=1.1.1",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "rich>=15.0.0",
    "typer>=0.27.3",
    "yfinance>=1.7.0",
]

[project.scripts]
market = "stock_market_intelligence_with_langchain.cli:app"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
